<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#060D1A" />
<meta name="color-scheme" content="dark" />
<title>404 — Lost in the void</title>
<style>
  /* ============================================================
     Design tokens
  ============================================================ */
  :root {
    --navy-950: #04090F;
    --navy-900: #060D1A;
    --navy-800: #0A1428;
    --navy-700: #0F1D38;
    --navy-600: #16294B;

    --blue-500: #2C7BE5;
    --blue-400: #4D9BFF;
    --blue-300: #7CB8FF;
    --blue-200: #A9CEFF;

    --text:      #E9F0FB;
    --text-soft: #9FB1CC;
    --text-dim:  #6C7F9C;

    --radius-card: 28px;
    --radius-btn: 14px;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { min-height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
    background: var(--navy-900);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 48px 24px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  /* ============================================================
     Ambient layers
  ============================================================ */
  .aurora {
    position: fixed;
    inset: -22%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(38% 32% at 22% 26%, rgba(77, 155, 255, 0.22), transparent 66%),
      radial-gradient(34% 30% at 80% 20%, rgba(139, 92, 246, 0.15), transparent 66%),
      radial-gradient(44% 38% at 62% 84%, rgba(44, 123, 229, 0.16), transparent 68%);
    filter: blur(34px);
    animation: aurora-drift 28s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes aurora-drift {
    0%   { transform: translate3d(-2%, -1.5%, 0) scale(1.02); }
    100% { transform: translate3d(2.5%, 2%, 0) scale(1.09); }
  }

  /* Faint blueprint grid */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(124, 184, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124, 184, 255, 0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 68%);
    mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 68%);
  }

  #fx {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    pointer-events: none;
  }

  .spotlight {
    position: fixed;
    top: 0;
    left: 0;
    width: 900px;
    height: 900px;
    margin: -450px 0 0 -450px;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(77, 155, 255, 0.13) 0%,
      rgba(77, 155, 255, 0.05) 38%,
      transparent 68%);
    will-change: transform;
  }

  /* ============================================================
     Card
  ============================================================ */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 660px;
    padding: 62px 56px 52px;
    text-align: center;
    border-radius: var(--radius-card);
    background:
      linear-gradient(180deg, rgba(22, 41, 75, 0.58) 0%, rgba(10, 20, 40, 0.84) 100%);
    border: 1px solid rgba(124, 184, 255, 0.13);
    box-shadow:
      0 44px 90px -28px rgba(0, 0, 0, 0.80),
      0 10px 32px -14px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.055);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transform-style: preserve-3d;
    will-change: transform;
  }

  /* top edge highlight */
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 12%;
    right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(124, 184, 255, 0.55), transparent);
    pointer-events: none;
  }

  /* cursor-tracked border glow */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: radial-gradient(
      260px circle at var(--px, 50%) var(--py, 0%),
      rgba(124, 184, 255, 0.75),
      rgba(124, 184, 255, 0.06) 55%,
      transparent 72%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
    z-index: 2;
  }

  .card:hover::after { opacity: 1; }

  /* ============================================================
     Badge
  ============================================================ */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 15px 7px 12px;
    margin-bottom: 30px;
    border-radius: 999px;
    background: rgba(77, 155, 255, 0.09);
    border: 1px solid rgba(124, 184, 255, 0.20);
    box-shadow: 0 6px 20px -10px rgba(77, 155, 255, 0.55);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue-200);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--blue-400);
    animation: pulse-ring 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(77, 155, 255, 0.50); }
    70%  { box-shadow: 0 0 0 8px rgba(77, 155, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(77, 155, 255, 0); }
  }

  /* ============================================================
     404 digits
  ============================================================ */
  .code-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 4px;
  }

  .code-wrap::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    width: 118%;
    height: 132%;
    background: radial-gradient(closest-side, rgba(77, 155, 255, 0.22), transparent 72%);
    filter: blur(22px);
    z-index: -1;
    pointer-events: none;
  }

  .code {
    display: flex;
    justify-content: center;
    /* font-size lives here so the sibling margin em-math below is correct */
    font-size: clamp(84px, 20vw, 168px);
    font-weight: 800;
    line-height: 0.9;
    user-select: none;
    -webkit-user-select: none;
  }

  .digit {
    display: inline-block;
    will-change: transform;
  }

  .digit + .digit { margin-left: -0.045em; }

  .digit-inner {
    display: block;
    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;
    background: linear-gradient(175deg, #FFFFFF 4%, var(--blue-200) 46%, var(--blue-400) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 14px 44px rgba(77, 155, 255, 0.30));
    cursor: pointer;
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.38s ease;
  }

  /* Only apply hover physics on devices that actually hover */
  @media (hover: hover) and (pointer: fine) {
    .digit:hover .digit-inner {
      transform: translateY(-8px) scale(1.05);
      filter: drop-shadow(0 22px 60px rgba(77, 155, 255, 0.62));
    }
  }

  .digit.pop .digit-inner {
    animation: pop 0.62s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes pop {
    0%   { transform: translateY(0) scale(1) rotate(0deg); }
    28%  { transform: translateY(-16px) scale(1.22) rotate(-5deg); }
    58%  { transform: translateY(4px) scale(0.92) rotate(4deg); }
    80%  { transform: translateY(-2px) scale(1.02) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }

  /* ============================================================
     Copy
  ============================================================ */
  .title {
    font-size: clamp(22px, 3.4vw, 28px);
    font-weight: 650;
    letter-spacing: -0.015em;
    color: var(--text);
    margin-bottom: 14px;
  }

  .message {
    max-width: 430px;
    margin: 0 auto;
    font-size: 15.5px;
    line-height: 1.68;
    color: var(--text-soft);
  }

  /* ============================================================
     Command / search field
  ============================================================ */
  .search {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(100%, 430px);
    margin: 30px auto 0;
    padding: 12px 14px 12px 16px;
    border-radius: 14px;
    background: rgba(6, 13, 26, 0.55);
    border: 1px solid rgba(124, 184, 255, 0.16);
    transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  }

  .search:focus-within {
    border-color: rgba(124, 184, 255, 0.48);
    background: rgba(6, 13, 26, 0.78);
    box-shadow:
      0 0 0 4px rgba(77, 155, 255, 0.10),
      0 12px 32px -16px rgba(77, 155, 255, 0.7);
  }

  .search-icon {
    flex: none;
    color: var(--text-dim);
    transition: color 0.25s ease;
  }

  .search:focus-within .search-icon { color: var(--blue-300); }

  .search-input {
    flex: 1 1 auto;
    min-width: 0;
    background: none;
    border: 0;
    outline: none;
    font: inherit;
    font-size: 14.5px;
    color: var(--text);
    caret-color: var(--blue-400);
  }

  .search-input::placeholder { color: var(--text-dim); }

  .search-kbd { flex: none; }

  /* Keyboard hint is meaningless on touch-only devices */
  @media (hover: none), (pointer: coarse) {
    .search-kbd { display: none; }
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }

  .search.shake { animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

  .search-msg {
    min-height: 22px;
    max-width: 430px;
    margin: 12px auto 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--blue-300);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .search-msg.show {
    opacity: 1;
    transform: translateY(0);
  }

  .search-msg code {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--blue-200);
    background: rgba(124, 184, 255, 0.10);
    border-radius: 5px;
    padding: 1px 5px;
  }

  /* ============================================================
     Actions
  ============================================================ */
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 28px;
  }

  .btn {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 34px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.005em;
    font-family: inherit;
    color: #FFFFFF;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    border-radius: var(--radius-btn);
    background: linear-gradient(180deg, var(--blue-400) 0%, var(--blue-500) 100%);
    box-shadow:
      0 14px 34px -12px rgba(77, 155, 255, 0.70),
      0 3px 10px -4px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.30);
    transform: translate3d(var(--mx, 0px), var(--my, 0px), 0);
    will-change: transform;
    transition: box-shadow 0.22s ease, filter 0.22s ease,
                background 0.22s ease, border-color 0.22s ease, color 0.22s ease;
  }

  .btn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(100deg,
      transparent 22%, rgba(255, 255, 255, 0.30) 50%, transparent 78%);
    transform: translateX(-130%);
    transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }

  .btn:hover::after { transform: translateX(130%); }

  .btn svg { transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1); }

  .btn:hover {
    transform: translate3d(var(--mx, 0px), calc(var(--my, 0px) - 2px), 0);
    filter: brightness(1.07);
    box-shadow:
      0 20px 44px -12px rgba(77, 155, 255, 0.82),
      0 4px 12px -4px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .btn:hover svg { transform: translateX(3px); }

  .btn:active {
    transform: translate3d(var(--mx, 0px), var(--my, 0px), 0) scale(0.975);
  }

  .btn:focus-visible {
    outline: 2px solid var(--blue-200);
    outline-offset: 4px;
  }

  .btn.ghost {
    color: var(--blue-200);
    background: rgba(124, 184, 255, 0.07);
    border-color: rgba(124, 184, 255, 0.22);
    box-shadow:
      0 10px 26px -16px rgba(0, 0, 0, 0.75),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .btn.ghost:hover {
    color: #FFFFFF;
    background: rgba(124, 184, 255, 0.14);
    border-color: rgba(124, 184, 255, 0.42);
    filter: none;
    box-shadow:
      0 16px 36px -16px rgba(77, 155, 255, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  /* ============================================================
     Telemetry
  ============================================================ */
  .telemetry {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 20px;
    margin-top: 30px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    user-select: none;
  }

  .tel {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .tel b {
    color: var(--blue-300);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .tel-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--blue-400);
    animation: blink 1.6s steps(1, end) infinite;
  }

  @keyframes blink {
    0%, 60% { opacity: 1; }
    61%, 100% { opacity: 0.2; }
  }

  /* ============================================================
     Hints
  ============================================================ */
  .hint {
    margin-top: 26px;
    font-size: 13.5px;
    color: var(--text-dim);
  }

  .hint a {
    color: var(--blue-300);
    text-decoration: none;
    border-bottom: 1px solid rgba(124, 184, 255, 0.30);
    padding-bottom: 1px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .hint a:hover {
    color: var(--blue-200);
    border-color: rgba(169, 206, 255, 0.75);
  }

  .hint--keys {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .hint--keys .sep { opacity: 0.4; }

  kbd {
    display: inline-block;
    min-width: 22px;
    padding: 2px 7px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.55;
    text-align: center;
    color: var(--blue-200);
    background: rgba(124, 184, 255, 0.09);
    border: 1px solid rgba(124, 184, 255, 0.20);
    border-bottom-width: 2px;
    border-radius: 6px;
  }

  /* ============================================================
     Toast
  ============================================================ */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 6;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(10, 20, 40, 0.90);
    border: 1px solid rgba(124, 184, 255, 0.28);
    color: var(--blue-200);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transform: translate(-50%, 20px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ============================================================
     Entrance
  ============================================================ */
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card > * {
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .card > *:nth-child(1)  { animation-delay: 0.05s; }
  .card > *:nth-child(2)  { animation-delay: 0.13s; }
  .card > *:nth-child(3)  { animation-delay: 0.21s; }
  .card > *:nth-child(4)  { animation-delay: 0.27s; }
  .card > *:nth-child(5)  { animation-delay: 0.33s; }
  .card > *:nth-child(6)  { animation-delay: 0.39s; }
  .card > *:nth-child(7)  { animation-delay: 0.45s; }
  .card > *:nth-child(8)  { animation-delay: 0.51s; }
  .card > *:nth-child(9)  { animation-delay: 0.57s; }
  .card > *:nth-child(10) { animation-delay: 0.63s; }

  /* ============================================================
     Reduced motion
  ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .aurora { animation: none; }
  }

  /* ============================================================
     Responsive
  ============================================================ */
  @media (max-width: 560px) {
    body { padding: 26px 16px; }
    .card { padding: 46px 24px 40px; border-radius: 22px; }
    .badge { margin-bottom: 24px; }
    .message { font-size: 15px; }
    .search { margin-top: 26px; }
    .actions { margin-top: 24px; gap: 10px; }
    .btn { width: 100%; padding: 16px 24px; }
    .telemetry { gap: 5px 14px; font-size: 10px; margin-top: 24px; }
    .hint { margin-top: 20px; }
    .spotlight { width: 560px; height: 560px; margin: -280px 0 0 -280px; }
    .toast { bottom: 18px; font-size: 12px; padding: 10px 18px; max-width: calc(100vw - 36px); white-space: normal; text-align: center; }
  }
</style>
</head>
<body>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>
  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <main class="card" id="card">

    <div class="code-wrap" aria-hidden="true">
      <h1 class="code" aria-label="404">
        <span class="digit" data-depth="1"><span class="digit-inner">4</span></span>
        <span class="digit" data-depth="1.8"><span class="digit-inner">0</span></span>
        <span class="digit" data-depth="1"><span class="digit-inner">4</span></span>
      </h1>
    </div>

    <h2 class="title">Page not found</h2>

    <p class="message">
      The page you're looking for doesn't exist or has been moved.
      Don't worry, everything is still right where you left it.
    </p>

    <form class="search" id="searchForm" role="search" novalidate>
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input id="searchInput" class="search-input" type="text" name="q"
             placeholder="Search the void…" aria-label="Search"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="search" />
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </form>
    <p class="search-msg" id="searchMsg" role="status" aria-live="polite"></p>

    <div class="actions">
      <a class="btn" href="https://hajir.is-a.dev/" id="homeBtn">
        Back to homepage
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
      <button class="btn ghost" type="button" id="backBtn">Go back</button>
    </div>

    <div class="telemetry" aria-hidden="true">
      <span class="tel"><i class="tel-dot"></i>signal lost</span>
      <span class="tel">x <b id="tX">0000</b></span>
      <span class="tel">y <b id="tY">0000</b></span>
      <span class="tel">drift <b id="tD">0</b></span>
    </div>

    <p class="hint">Still stuck? <a href="https://hajir.is-a.dev/#contact">Contact support</a></p>

    <p class="hint--keys">
      <kbd>H</kbd> home <span class="sep">·</span>
      <kbd>B</kbd> back <span class="sep">·</span>
      <kbd>/</kbd> search <span class="sep">·</span>
      <span>click a digit for fun</span>
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     Environment
  ============================================================ */
  var reduceMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
  var REDUCED = reduceMQ.matches;
  var FINE = window.matchMedia("(pointer: fine)").matches;
  var TAU = Math.PI * 2;

  var canvas    = document.getElementById("fx");
  var ctx       = canvas.getContext("2d");
  var card      = document.getElementById("card");
  var spotlight = document.getElementById("spotlight");
  var toastEl   = document.getElementById("toast");
  var form      = document.getElementById("searchForm");
  var input     = document.getElementById("searchInput");
  var msgEl     = document.getElementById("searchMsg");
  var tX        = document.getElementById("tX");
  var tY        = document.getElementById("tY");
  var tD        = document.getElementById("tD");
  var homeBtn   = document.getElementById("homeBtn");
  var backBtn   = document.getElementById("backBtn");

  var HOME_URL = homeBtn.href; /* single source of truth for "home" */

  var digitEls  = Array.prototype.slice.call(document.querySelectorAll(".digit"));
  var magnetEls = Array.prototype.slice.call(document.querySelectorAll(".btn"));

  /* ============================================================
     State
  ============================================================ */
  var W = 0, H = 0, DPR = 1;
  var TIME = 0, lastT = 0, rafId = null, running = false;
  var warp = 0;

  var P = {
    tx: window.innerWidth / 2, ty: window.innerHeight / 2,
    x:  window.innerWidth / 2, y:  window.innerHeight / 2,
    nx: 0, ny: 0,
    active: false, down: false
  };

  var stars = [], dust = [], waves = [], sparks = [], shooting = [];
  var trail = [];
  var shootTimer = 200;

  var LINK = 130, LINK2 = LINK * LINK;
  var LINK_ALPHA = [
    "rgba(124,184,255,0)",
    "rgba(124,184,255,0.035)",
    "rgba(124,184,255,0.070)",
    "rgba(124,184,255,0.105)",
    "rgba(124,184,255,0.140)",
    "rgba(124,184,255,0.180)"
  ];

  /* ============================================================
     Canvas sizing / builders
  ============================================================ */
  function resizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    buildStars();
    buildDust();
    cacheRects();

    if (REDUCED) drawStatic();
  }

  function buildStars() {
    var n = Math.round(Math.min(280, Math.max(60, (W * H) / 6500)));
    stars = [];
    for (var i = 0; i < n; i++) {
      var z = Math.random() * 0.85 + 0.15;
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: z,
        r: 0.35 + z * 1.25,
        a: 0.25 + Math.random() * 0.55,
        tw: Math.random() * TAU,
        tws: 0.5 + Math.random() * 1.8
      });
    }
  }

  function buildDust() {
    var n = Math.round(Math.min(56, Math.max(14, (W * H) / 34000)));
    dust = [];
    for (var i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.3 + 0.7,
        a: Math.random() * 0.35 + 0.18
      });
    }
  }

  /* ============================================================
     Pointer
  ============================================================ */
  function onPointerMove(e) {
    P.tx = e.clientX;
    P.ty = e.clientY;
    P.active = true;
  }

  window.addEventListener("pointermove", onPointerMove, { passive: true });

  window.addEventListener("pointerdown", function (e) {
    P.down = true;
    P.tx = e.clientX;
    P.ty = e.clientY;
    P.active = true;
    if (!REDUCED) {
      spawnWave(e.clientX, e.clientY);
      burst(e.clientX, e.clientY, 12);
    }
  }, { passive: true });

  window.addEventListener("pointerup", function (e) {
    P.down = false;
    /* Touch/pen pointers vanish — don't leave the aura stuck on screen. */
    if (e.pointerType && e.pointerType !== "mouse") P.active = false;
  }, { passive: true });

  window.addEventListener("pointercancel", function () {
    P.down = false;
    P.active = false;
  }, { passive: true });

  /* Reliable "pointer left the window" detection */
  document.documentElement.addEventListener("mouseleave", function () {
    P.active = false;
    P.down = false;
    P.nx = 0;
    P.ny = 0;
  });

  window.addEventListener("blur", function () {
    P.active = false;
    P.down = false;
  });

  /* ============================================================
     Simulation
  ============================================================ */
  function updatePointer(dt) {
    var k = Math.min(1, 0.22 * dt);
    P.x += (P.tx - P.x) * k;
    P.y += (P.ty - P.y) * k;
    P.nx = P.tx / W - 0.5;
    P.ny = P.ty / H - 0.5;
  }

  function updateTrail(dt) {
    if (P.active && !REDUCED) {
      trail.push({ x: P.tx, y: P.ty, life: 1 });
    }
    for (var i = trail.length - 1; i >= 0; i--) {
      trail[i].life -= 0.055 * dt;
      if (trail[i].life <= 0) trail.splice(i, 1);
    }
    while (trail.length > 26) trail.shift();
  }

  function updateStars(dt) {
    var drift = 0.055 * dt * (1 + warp * 6);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += drift * s.z;
      if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    }
  }

  function updateDust(dt) {
    var R = P.down ? 230 : 150;
    var R2 = R * R;

    for (var i = 0; i < dust.length; i++) {
      var p = dust[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if (P.active) {
        var dx = p.x - P.x;
        var dy = p.y - P.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < R2 && d2 > 4) {
          var d = Math.sqrt(d2);
          var t = 1 - d / R;
          if (P.down) {
            var fa = t * t * 2.4 * dt;
            p.x -= (dx / d) * fa;
            p.y -= (dy / d) * fa;
          } else {
            var fr = t * 1.1 * dt;
            p.x += (dx / d) * fr;
            p.y += (dy / d) * fr;
          }
        }
      }

      for (var w = 0; w < waves.length; w++) {
        var wv = waves[w];
        var wx = p.x - wv.x;
        var wy = p.y - wv.y;
        var wd = Math.sqrt(wx * wx + wy * wy) || 1;
        var band = Math.abs(wd - wv.r);
        if (band < 46) {
          var fw = (1 - band / 46) * 3.6 * dt * wv.life;
          p.x += (wx / wd) * fw;
          p.y += (wy / wd) * fw;
        }
      }

      if (p.x < -40) p.x = W + 40;
      else if (p.x > W + 40) p.x = -40;
      if (p.y < -40) p.y = H + 40;
      else if (p.y > H + 40) p.y = -40;
    }
  }

  function spawnWave(x, y) {
    waves.push({ x: x, y: y, r: 6, max: Math.max(W, H) * 0.55, life: 1 });
    if (waves.length > 6) waves.shift();
  }

  function updateWaves(dt) {
    for (var i = waves.length - 1; i >= 0; i--) {
      var w = waves[i];
      w.r += (w.max - w.r) * 0.055 * dt;
      w.life -= 0.018 * dt;
      if (w.life <= 0) waves.splice(i, 1);
    }
  }

  function burst(x, y, count) {
    if (REDUCED) return;
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * TAU;
      var sp = Math.random() * 4 + 0.6;
      sparks.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 0.6,
        r: Math.random() * 2 + 0.8,
        life: 1,
        c: Math.random() > 0.5 ? "169,206,255" : "77,155,255"
      });
    }
    if (sparks.length > 320) sparks.splice(0, sparks.length - 320);
  }

  function updateSparks(dt) {
    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= 0.965;
      s.vy = s.vy * 0.965 + 0.04 * dt;
      s.life -= 0.016 * dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  function updateShooting(dt) {
    shootTimer -= dt;
    if (shootTimer <= 0 && !REDUCED) {
      shootTimer = 320 + Math.random() * 520;
      var dir = Math.random() > 0.5 ? 1 : -1;
      var ang = 0.22 + Math.random() * 0.3;
      var sp = 7 + Math.random() * 7;
      shooting.push({
        x: dir === 1 ? -60 : W + 60,
        y: Math.random() * H * 0.55,
        vx: Math.cos(ang) * sp * dir,
        vy: Math.sin(ang) * sp,
        life: 1
      });
      if (shooting.length > 3) shooting.shift();
    }

    for (var i = shooting.length - 1; i >= 0; i--) {
      var s = shooting[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= 0.009 * dt;
      if (s.life <= 0 || s.x < -140 || s.x > W + 140 || s.y > H + 140) {
        shooting.splice(i, 1);
      }
    }
  }

  /* ============================================================
     Rendering
  ============================================================ */
  function drawStars() {
    var ox = P.x - W / 2;
    var oy = P.y - H / 2;

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var par = 0.045 * s.z;
      var sx = s.x - ox * par;
      var sy = s.y - oy * par;

      if (sx < -24 || sx > W + 24 || sy < -24 || sy > H + 24) continue;

      var tw = 0.6 + 0.4 * Math.sin(TIME * s.tws + s.tw);
      var alpha = s.a * tw;

      if (warp > 0.02) {
        var dx = sx - W / 2;
        var dy = sy - H / 2;
        var k = warp * s.z * 0.14;
        ctx.strokeStyle = "rgba(190,218,255," + (alpha * 0.9).toFixed(3) + ")";
        ctx.lineWidth = s.r * 0.9;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + dx * k, sy + dy * k);
        ctx.stroke();
      } else {
        ctx.fillStyle = "rgba(206,226,255," + alpha.toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(sx, sy, s.r, 0, TAU);
        ctx.fill();
      }
    }
  }

  function drawDust() {
    ctx.lineWidth = 1;

    for (var i = 0; i < dust.length; i++) {
      var a = dust[i];
      for (var j = i + 1; j < dust.length; j++) {
        var b = dust[j];
        var dx = a.x - b.x;
        var dy = a.y - b.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < LINK2) {
          var t = 1 - Math.sqrt(d2) / LINK;
          ctx.strokeStyle = LINK_ALPHA[Math.min(5, (t * 6) | 0)];
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    if (P.active) {
      var R = 200, R2 = R * R;
      for (var k = 0; k < dust.length; k++) {
        var q = dust[k];
        var qx = q.x - P.x;
        var qy = q.y - P.y;
        var q2 = qx * qx + qy * qy;
        if (q2 < R2) {
          var qt = 1 - Math.sqrt(q2) / R;
          ctx.strokeStyle = "rgba(169,206,255," + (qt * 0.30).toFixed(3) + ")";
          ctx.beginPath();
          ctx.moveTo(q.x, q.y);
          ctx.lineTo(P.x, P.y);
          ctx.stroke();
        }
      }
    }

    for (var m = 0; m < dust.length; m++) {
      var p = dust[m];
      ctx.fillStyle = "rgba(169,206,255," + p.a.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
  }

  function drawWaves() {
    for (var i = 0; i < waves.length; i++) {
      var w = waves[i];
      ctx.strokeStyle = "rgba(124,184,255," + (w.life * 0.42).toFixed(3) + ")";
      ctx.lineWidth = 1 + w.life * 2;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r, 0, TAU);
      ctx.stroke();
    }
  }

  function drawSparks() {
    for (var i = 0; i < sparks.length; i++) {
      var s = sparks[i];
      var l = Math.max(s.life, 0);
      ctx.fillStyle = "rgba(" + s.c + "," + l.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * Math.max(l, 0.25), 0, TAU);
      ctx.fill();
    }
  }

  function drawShooting() {
    ctx.lineCap = "round";
    for (var i = 0; i < shooting.length; i++) {
      var s = shooting[i];
      var tx = s.x - s.vx * 9;
      var ty = s.y - s.vy * 9;
      var g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, "rgba(233,240,251," + (s.life * 0.9).toFixed(3) + ")");
      g.addColorStop(0.35, "rgba(124,184,255," + (s.life * 0.35).toFixed(3) + ")");
      g.addColorStop(1, "rgba(124,184,255,0)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
  }

  function drawTrail() {
    if (trail.length < 2) return;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (var i = 1; i < trail.length; i++) {
      var a = trail[i - 1];
      var b = trail[i];
      var t = i / trail.length;
      var l = Math.min(a.life, b.life);
      if (l <= 0) continue;
      ctx.strokeStyle = "rgba(140,195,255," + (t * t * 0.5 * l).toFixed(3) + ")";
      ctx.lineWidth = t * 3.6 + 0.3;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  function drawStatic() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.fillStyle = "rgba(206,226,255," + (s.a * 0.8).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    for (var m = 0; m < dust.length; m++) {
      var p = dust[m];
      ctx.fillStyle = "rgba(169,206,255," + p.a.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
  }

  /* ============================================================
     Digits — parallax + cursor repulsion
     Base centres are stored in CARD-LOCAL coordinates so scrolling
     and the card's own tilt can never invalidate them.
  ============================================================ */
  var digitStates = digitEls.map(function (el) {
    return {
      el: el,
      depth: parseFloat(el.getAttribute("data-depth")) || 1,
      x: 0, y: 0,
      cx: null, cy: null
    };
  });

  function measureDigits() {
    var cr = card.getBoundingClientRect();
    digitStates.forEach(function (d) {
      var prev = d.el.style.transform;
      d.el.style.transform = "none";
      var r = d.el.getBoundingClientRect();
      d.cx = r.left + r.width / 2 - cr.left;
      d.cy = r.top + r.height / 2 - cr.top;
      d.el.style.transform = prev;
    });
  }

  var REPEL_R = 170;
  var REPEL_F = 36;

  function updateDigits() {
    if (REDUCED) return;

    var cr = cardRect || card.getBoundingClientRect();

    for (var i = 0; i < digitStates.length; i++) {
      var d = digitStates[i];
      var tx = P.nx * 26 * d.depth;
      var ty = P.ny * 18 * d.depth;

      if (FINE && d.cx !== null) {
        /* live on-screen centre = card origin + local offset + current push */
        var curX = cr.left + d.cx + d.x;
        var curY = cr.top + d.cy + d.y;
        var dx = curX - P.tx;
        var dy = curY - P.ty;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < REPEL_R && dist > 0.001) {
          var f = 1 - dist / REPEL_R;
          tx += (dx / dist) * f * REPEL_F;
          ty += (dy / dist) * f * REPEL_F;
        }
      }

      var k = 1 - Math.pow(1 - 0.12, dtNorm);
      d.x += (tx - d.x) * k;
      d.y += (ty - d.y) * k;
      d.el.style.transform =
        "translate3d(" + d.x.toFixed(2) + "px," + d.y.toFixed(2) + "px,0)";
    }
  }

  function popDigit(el) {
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");

    var r = el.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;

    if (!REDUCED) {
      spawnWave(cx, cy);
      burst(cx, cy, 26);
    }

    el.addEventListener("animationend", function handler() {
      el.classList.remove("pop");
      el.removeEventListener("animationend", handler);
    });
  }

  digitEls.forEach(function (el) {
    el.addEventListener("click", function () { popDigit(el); });
  });

  /* ============================================================
     Card tilt + border glow
  ============================================================ */
  var tiltX = 0, tiltY = 0;
  var cardRect = null;

  function updateTilt() {
    if (!FINE || REDUCED) return;
    var gx = -P.ny * 5;
    var gy = P.nx * 7;
    tiltX += (gx - tiltX) * 0.07;
    tiltY += (gy - tiltY) * 0.07;
    card.style.transform =
      "perspective(1400px) rotateX(" + tiltX.toFixed(2) + "deg) rotateY(" +
      tiltY.toFixed(2) + "deg)";
  }

  function updateCardGlow() {
    if (!cardRect || !P.active) return;
    card.style.setProperty("--px", (P.tx - cardRect.left).toFixed(0) + "px");
    card.style.setProperty("--py", (P.ty - cardRect.top).toFixed(0) + "px");
  }

  /* ============================================================
     Magnetic buttons
  ============================================================ */
  var magnets = magnetEls.map(function (el) {
    return { el: el, x: 0, y: 0, rect: null };
  });

  function updateMagnets(dt) {
    if (!FINE || REDUCED) return;

    for (var i = 0; i < magnets.length; i++) {
      var m = magnets[i];
      if (!m.rect) continue;

      var cx = m.rect.left + m.rect.width / 2;
      var cy = m.rect.top + m.rect.height / 2;
      var dx = P.tx - cx;
      var dy = P.ty - cy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var radius = Math.max(m.rect.width, m.rect.height) / 2 + 74;

      var tx = 0, ty = 0;
      if (P.active && dist < radius) {
        var pull = (1 - dist / radius) * 0.32;
        tx = dx * pull;
        ty = dy * pull;
      }

      var k = Math.min(1, 0.14 * dt);
      m.x += (tx - m.x) * k;
      m.y += (ty - m.y) * k;

      m.el.style.setProperty("--mx", m.x.toFixed(2) + "px");
      m.el.style.setProperty("--my", m.y.toFixed(2) + "px");
    }
  }

  /* ============================================================
     Spotlight
  ============================================================ */
  function updateSpotlight() {
    if (REDUCED) return;
    spotlight.style.transform =
      "translate3d(" + P.x.toFixed(1) + "px," + P.y.toFixed(1) + "px,0)";
  }

  /* ============================================================
     Telemetry
  ============================================================ */
  var telAcc = 0;
  var lastSampleX = P.tx, lastSampleY = P.ty;

  function pad(n, len) {
    var s = String(Math.max(0, Math.round(n)));
    while (s.length < len) s = "0" + s;
    return s;
  }

  function updateTelemetry(dt) {
    telAcc += dt;
    if (telAcc < 6) return;
    telAcc = 0;

    var dist = Math.sqrt(
      (P.tx - lastSampleX) * (P.tx - lastSampleX) +
      (P.ty - lastSampleY) * (P.ty - lastSampleY)
    );
    lastSampleX = P.tx;
    lastSampleY = P.ty;

    tX.textContent = pad(P.tx, 4);
    tY.textContent = pad(P.ty, 4);
    tD.textContent = dist.toFixed(0);
  }

  /* ============================================================
     Main loop
  ============================================================ */
  var dtNorm = 1;

  function frame(now) {
    rafId = requestAnimationFrame(frame);

    if (!lastT) lastT = now;
    dtNorm = (now - lastT) / 16.6667;
    lastT = now;
    if (dtNorm > 3) dtNorm = 3;
    if (dtNorm <= 0) dtNorm = 1;

    TIME += dtNorm * 0.016;

    updatePointer(dtNorm);
    updateTrail(dtNorm);
    updateStars(dtNorm);
    updateDust(dtNorm);
    updateWaves(dtNorm);
    updateSparks(dtNorm);
    updateShooting(dtNorm);

    ctx.clearRect(0, 0, W, H);
    drawStars();
    drawDust();
    drawWaves();
    drawSparks();
    drawShooting();
    drawTrail();

    if (warp > 0) warp = Math.max(0, warp - 0.014 * dtNorm);

    updateDigits();
    updateTilt();
    updateMagnets(dtNorm);
    updateSpotlight();
    updateCardGlow();
    updateTelemetry(dtNorm);
  }

  function start() {
    if (running || REDUCED) return;
    running = true;
    lastT = 0;
    rafId = requestAnimationFrame(frame);
  }

  function stop() {
    running = false;
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop();
    else start();
  });

  if (reduceMQ.addEventListener) {
    reduceMQ.addEventListener("change", function (e) {
      REDUCED = e.matches;
      if (REDUCED) { stop(); drawStatic(); }
      else { start(); }
    });
  } else if (reduceMQ.addListener) {
    reduceMQ.addListener(function (e) {
      REDUCED = e.matches;
      if (REDUCED) { stop(); drawStatic(); }
      else { start(); }
    });
  }

  /* ============================================================
     Toast
  ============================================================ */
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2600);
  }

  /* ============================================================
     Warp (easter egg)
  ============================================================ */
  function engageWarp() {
    if (REDUCED) { toast("Warp unavailable in reduced-motion mode"); return; }
    warp = 1.15;
    toast("Warp drive engaged ✦");
  }

  /* ============================================================
     Search / command line
  ============================================================ */
  var REPLIES = [
    function (q) { return "Searched all 11 dimensions for \u201C" + q + "\u201D. Nothing."; },
    function (q) { return "\u201C" + q + "\u201D returned 0 results in 0.00042s."; },
    function (q) { return "We checked under the couch. \u201C" + q + "\u201D wasn't there."; },
    function (q) { return "\u201C" + q + "\u201D is in another castle."; },
    function (q) { return "Our servers shrugged at \u201C" + q + "\u201D."; },
    function (q) { return "404\u00B2 — \u201C" + q + "\u201D not found, twice."; }
  ];

  function showMsg(html) {
    msgEl.innerHTML = html || "";
    msgEl.classList.toggle("show", !!html);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function runCommand(raw) {
    var q = raw.trim();
    if (!q) {
      showMsg("Type something — or try <code>help</code>.");
      return;
    }
    var cmd = q.toLowerCase();

    if (cmd === "home" || cmd === "cd /") { goHome(); return; }
    if (cmd === "back" || cmd === "cd ..") { goBack(); return; }
    if (cmd === "warp") { engageWarp(); showMsg("Engaging warp drive…"); return; }
    if (cmd === "clear" || cmd === "cls") { showMsg(""); input.value = ""; return; }
    if (cmd === "help" || cmd === "?") {
      showMsg("Commands: <code>home</code> · <code>back</code> · " +
              "<code>warp</code> · <code>clear</code> · <code>help</code>");
      return;
    }
    if (cmd.indexOf("sudo") === 0) {
      showMsg("Nice try. You are not root in this dimension.");
      return;
    }

    var pick = REPLIES[(Math.random() * REPLIES.length) | 0];
    showMsg(pick(escapeHtml(q)));
  }

  var shakeTimer = null;
  function shakeForm() {
    form.classList.remove("shake");
    void form.offsetWidth;          /* force reflow so the animation restarts */
    form.classList.add("shake");
    clearTimeout(shakeTimer);
    shakeTimer = setTimeout(function () { form.classList.remove("shake"); }, 600);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    runCommand(input.value);
    shakeForm();
  });

  /* ============================================================
     Navigation
  ============================================================ */
  function goHome() { window.location.href = HOME_URL; }

  function goBack() {
    var ref = document.referrer;
    var cameFromHere = false;
    try {
      cameFromHere = !!ref && new URL(ref).origin === window.location.origin;
    } catch (err) { cameFromHere = false; }

    if (cameFromHere && window.history.length > 1) window.history.back();
    else goHome();
  }

  backBtn.addEventListener("click", goBack);

  /* ============================================================
     Keyboard
  ============================================================ */
  var SEQ = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown",
             "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight"];
  var seqIdx = 0;

  document.addEventListener("keydown", function (e) {
    /* Konami-ish sequence — always tracked, even inside inputs */
    if (e.key === SEQ[seqIdx]) {
      seqIdx++;
      if (seqIdx === SEQ.length) {
        seqIdx = 0;
        engageWarp();
      }
    } else {
      seqIdx = (e.key === SEQ[0]) ? 1 : 0;
    }

    if (e.metaKey || e.ctrlKey || e.altKey) return;

    var t = e.target;
    var typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);

    if (typing) {
      if (e.key === "Escape") { t.blur(); showMsg(""); }
      return;
    }

    if (e.key === "/") {
      e.preventDefault();
      input.focus();
      input.select();
      return;
    }

    var k = e.key.toLowerCase();
    if (k === "h") { e.preventDefault(); goHome(); }
    else if (k === "b") { e.preventDefault(); goBack(); }
  });

  /* ============================================================
     Rect caching
  ============================================================ */
  function cacheRects() {
    cardRect = card.getBoundingClientRect();

    for (var i = 0; i < magnets.length; i++) {
      magnets[i].rect = magnets[i].el.getBoundingClientRect();
    }

    measureDigits();
  }

  /* ============================================================
     Boot
  ============================================================ */
  var resizeTimer = null;
  var scrollRaf = null;

  function scheduleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 140);
  }

  window.addEventListener("resize", scheduleResize);
  window.addEventListener("orientationchange", scheduleResize);

  window.addEventListener("scroll", function () {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(function () {
      scrollRaf = null;
      cardRect = card.getBoundingClientRect();
      for (var i = 0; i < magnets.length; i++) {
        magnets[i].rect = magnets[i].el.getBoundingClientRect();
      }
    });
  }, { passive: true });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { setTimeout(cacheRects, 60); });
  }
  window.addEventListener("load", function () { setTimeout(cacheRects, 140); });

  resizeCanvas();
  spotlight.style.transform =
    "translate3d(" + (W / 2) + "px," + (H / 2) + "px,0)";

  start();
})();
</script>

</body>
